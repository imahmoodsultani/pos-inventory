# Pull-request quality gate (T103a).
#
# The constitution requires that every change passes type-checking and linting before merge, and
# that `main` stays deployable at all times. These are the checks that enforce it.
#
# Integration tests run here too, not just locally: they are the only proof that oversell is
# impossible and that the accounting identity holds, and a guarantee that is only checked on a
# developer's laptop is not a guarantee. GitHub runners provide Docker, which Testcontainers uses.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned via .nvmrc so CI and local development cannot drift. Vitest 5 requires
          # ^22.12 || ^24 || >=26 — Node 25 satisfies none of them.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests (real Postgres via Testcontainers)
        run: npm run test:integration

      - name: Build
        run: npm run build
        env:
          # The build imports lib/db, which refuses to start without a connection string. This
          # value is never connected to — it only has to parse.
          DATABASE_URL: postgres://build:build@localhost:5432/build
          BETTER_AUTH_SECRET: build-time-placeholder-not-a-real-secret
          BETTER_AUTH_URL: http://localhost:3000
